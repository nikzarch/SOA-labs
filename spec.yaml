openapi: 3.0.0
info:
  title: lab1
  description: lab1
  version: 1.0.0
paths:
  /cities:
    get:
      tags:
        - Cities
      summary: Получить список городов
      operationId: getCities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderedBy'
      responses:
        '200':
          description: Страница результатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Cities
      summary: Добавить новый город
      operationId: createCity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityRequest'
      responses:
        '201':
          description: Город успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/ValidationError'
  /cities/{id}:
    get:
      tags:
        - Cities
      summary: Получить город по ID
      operationId: getCityById
      parameters:
        - $ref: '#/components/parameters/CityId'
      responses:
        '200':
          description: Город найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Cities
      summary: Обновить город
      operationId: updateCity
      parameters:
        - $ref: '#/components/parameters/CityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityRequest'
      responses:
        '200':
          description: Город успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Cities
      summary: Удалить город
      operationId: deleteCity
      parameters:
        - $ref: '#/components/parameters/CityId'
      responses:
        '204':
          description: Город удален или уже отсутствует
        '400':
          $ref: '#/components/responses/ValidationError'
  /cities/min-standard-of-living:
    get:
      tags:
        - Special operations
      summary: Получить город с минимальным уровнем жизни # возвращать если несколько то мин айди
      description: |
        Возвращает любой город, значение standardOfLiving которого
        является минимальным (индекс значения в енаме)
        Если городов подходящих несколько, то возвращается с минимальным идентификатором
      operationId: getCityWithMinStandardOfLiving
      responses:
        '200':
          description: Город с минимальным standardOfLiving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: В коллекции нет городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cities/max-area:
    get:
      tags:
        - Special operations
      summary: Получить город с максимальной площадью
      operationId: getCityWithMaxArea
      responses:
        '200':
          description: Город с максимальным значением площади area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: В коллекции нет городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cities/name:
    get:
      tags:
        - Special operations
      summary: Найти города по подстроке имени
      description: |
        Возвращает все города, значение поля name которых содержит
        указанную подстроку (чувствителен к регистру)
      operationId: findCitiesByName
      parameters:
        - name: substring
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Массив найденных городов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    CityId:
      name: id
      in: path
      required: true
      description: Уникальный идентификатор города
      schema:
        type: integer
        format: int32
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Filter:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/Filter'
    OrderedBy:
      name: orderedBy
      in: query
      required: false
      style: deepObject
      explode: true

      schema:
        $ref: '#/components/schemas/OrderedBy'
  schemas:
    Filter:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IntFilter'
        name:
          $ref: '#/components/schemas/StringFilter'
        coordinates:
          $ref: '#/components/schemas/CoordinatesFilter'
        creationDate:
          $ref: '#/components/schemas/DateTimeFilter'
        area:
          $ref: '#/components/schemas/LongFilter'
        population:
          $ref: '#/components/schemas/LongFilter'
        metersAboveSeaLevel:
          $ref: '#/components/schemas/DoubleFilter'
        climate:
          $ref: '#/components/schemas/ClimateFilter'
        government:
          $ref: '#/components/schemas/GovernmentFilter'
        standardOfLiving:
          $ref: '#/components/schemas/StandardOfLivingFilter'
        governor:
          $ref: '#/components/schemas/HumanFilter'
    OrderedBy:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SortOrder'
        name:
          $ref: '#/components/schemas/SortOrder'
        coordinates:
          type: object
          properties:
            x:
              $ref: '#/components/schemas/SortOrder'
            y:
              $ref: '#/components/schemas/SortOrder'
        creationDate:
          $ref: '#/components/schemas/SortOrder'
        area:
          $ref: '#/components/schemas/SortOrder'
        population:
          $ref: '#/components/schemas/SortOrder'
        metersAboveSeaLevel:
          $ref: '#/components/schemas/SortOrder'
        climate:
          $ref: '#/components/schemas/SortOrder'
        government:
          $ref: '#/components/schemas/SortOrder'
        standardOfLiving:
          $ref: '#/components/schemas/SortOrder'
        governor:
          type: object
          properties:
            age:
              $ref: '#/components/schemas/SortOrder'
    FilterOperator:
      type: string
      enum:
        - moreThan
        - lessThan
        - equals
    SortOrder:
      type: string
      enum:
        - asc
        - desc
    IntFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: integer
          format: int32
    LongFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: integer
          format: int64
    DoubleFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: number
          format: double
    StringFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: string
    DateTimeFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: string
          example: '2026-09-12T15:30:45'
    CoordinatesFilter:
      type: object
      properties:
        x:
          $ref: '#/components/schemas/IntFilter'
        y:
          $ref: '#/components/schemas/DoubleFilter'
    HumanFilter:
      type: object
      properties:
        age:
          $ref: '#/components/schemas/IntFilter'
    ClimateFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - equals
        value:
          $ref: '#/components/schemas/Climate'
    GovernmentFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - equals
        value:
          $ref: '#/components/schemas/Government'
    StandardOfLivingFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - equals
        value:
          $ref: '#/components/schemas/StandardOfLiving'
    City:
      description: Полный объект города, включая поля, генерируемые сервером.
      allOf:
        - $ref: '#/components/schemas/CityRequest'
        - type: object
          required:
            - id
            - creationDate
          properties:
            id:
              type: integer
              format: int32
              minimum: 1
              readOnly: true
              description: Уникальный идентификатор
            creationDate:
              type: string
              readOnly: true
              description: Дата и время создания города в формате LocalDateTime
              example: '2026-09-12T15:30:45'
    CityRequest:
      type: object
      description: Поля города, передаваемые клиентом при создании и изменении.
      required:
        - name
        - coordinates
        - area
        - population
        - climate
        - government
        - governor
      properties:
        name:
          type: string
          minLength: 1
          description: Название города
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        area:
          type: integer
          format: int64
          minimum: 1
          description: Площадь города
        population:
          type: integer
          format: int64
          minimum: 1
          description: Население города
        metersAboveSeaLevel:
          type: number
          format: double
          nullable: true
          description: Высота над уровнем моря
        climate:
          $ref: '#/components/schemas/Climate'
        government:
          $ref: '#/components/schemas/Government'
        standardOfLiving:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StandardOfLiving'
          description: Уровень жизни
        governor:
          $ref: '#/components/schemas/Human'
    Coordinates:
      type: object
      required:
        - y
      properties:
        x:
          type: integer
          format: int32
          nullable: false
        y:
          type: number
          format: double
          minimum: -594
          exclusiveMinimum: true
          nullable: false
    Human:
      type: object
      required:
        - age
      properties:
        age:
          type: integer
          format: int32
          minimum: 1
    Climate:
      type: string
      enum:
        - RAIN_FOREST
        - HUMIDSUBTROPICAL
        - HUMIDCONTINENTAL
        - SUBARCTIC
        - DESERT
    Government:
      type: string
      enum:
        - DICTATORSHIP
        - KLEPTOCRACY
        - KRITARCHY
        - REPUBLIC
        - TELLUROCRACY
    StandardOfLiving:
      type: string
      enum:
        - ULTRA_HIGH
        - HIGH
        - NIGHTMARE
    CityPage:
      type: object
      required:
        - content
        - page
        - pageSize
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/City'
        page:
          type: integer
          minimum: 1
          description: Номер текущей страницы
        pageSize:
          type: integer
          minimum: 1
          description: Размер страницы
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Количество элементов
        totalPages:
          type: integer
          minimum: 0
          description: Количество страниц
    Error:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
        timestamp:
          type: string
          description: Время возникновения ошибки в формате LocalDateTime
          example: '2026-09-12T15:30:45'
  responses:
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Ошибка валидации параметров запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект с указанным id не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
