openapi: 3.0.0
info:
  title: lab1
  description: lab1
  version: 1.0.0
paths:
  /cities:
    get:
      tags:
        - Cities
      summary: Получить список городов
      operationId: getCities

      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/OrderBy' # несколько полей фильтрации и сортировки, фильтры различные типо больше меньше равно

        - name: id
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1

        - name: name
          in: query
          required: false
          schema:
            type: string

        - name: coordinates.x
          in: query
          required: false
          schema:
            nullable: false
            type: integer
            format: int32

        - name: coordinates.y
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -594
            exclusiveMinimum: true

        - name: creationDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-09-12T15:30:45"

        - name: area
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: population
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: metersAboveSeaLevel
          in: query
          required: false
          schema:
            type: number
            format: double

        - name: climate
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Climate'

        - name: government
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Government'

        - name: standardOfLiving
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StandardOfLiving'

        - name: governor.age
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1

      responses:
        '200':
          description: Страница результатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityPage'

        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags:
        - Cities
      summary: Добавить новый город
      operationId: createCity

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityCreate'

      responses:
        '201':
          description: Город успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '400':
          $ref: '#/components/responses/ValidationError'

  /cities/{id}:
    get:
      tags:
        - Cities
      summary: Получить город по ID
      operationId: getCityById

      parameters:
        - $ref: '#/components/parameters/CityId'

      responses:
        '200':
          description: Город найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Cities
      summary: Обновить город
      operationId: updateCity

      parameters:
        - $ref: '#/components/parameters/CityId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityUpdate'

      responses:
        '200':
          description: Город успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '400':
          $ref: '#/components/responses/ValidationError'

        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Cities
      summary: Удалить город
      operationId: deleteCity

      parameters:
        - $ref: '#/components/parameters/CityId'

      responses:
        '204':
          description: Город удален или уже отсутствует
        '400':
          $ref: '#/components/responses/ValidationError'



  /cities/min-standard-of-living:
    get:
      tags:
        - Special operations
      summary: Получить город с минимальным уровнем жизни # возвращать если несколько то мин айди
      description: |
        Возвращает любой город, значение standardOfLiving которого
        является минимальным (индекс значения в енаме)
        Если городов подходящих несколько, то возвращается с минимальным идентификатором
      operationId: getCityWithMinStandardOfLiving

      responses:
        '200':
          description: Город с минимальным standardOfLiving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '404':
          description: В коллекции нет городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /cities/max-area:
    get:
      tags:
        - Special operations
      summary: Получить город с максимальной площадью
      operationId: getCityWithMaxArea

      responses:
        '200':
          description: Город с максимальным значением площади area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '404':
          description: В коллекции нет городов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /cities/name:
    get:
      tags:
        - Special operations
      summary: Найти города по подстроке имени
      description: |
        Возвращает все города, значение поля name которых содержит
        указанную подстроку (чувствителен к регистру)
      operationId: findCitiesByName

      parameters:
        - name: substring
          in: query
          required: true
          schema:
            type: string
            minLength: 1

      responses:
        '200':
          description: Массив найденных городов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'

        '400':
          $ref: '#/components/responses/BadRequest'

  /route/calculate/to-largest:
    get:
      tags:
        - Routes # отдельная страничка сваггера
      summary: Рассчитать длину маршрута до крупнейшего города
      description: |
        Получает из первого вебсервиса город с максимальной площадью
        и рассчитывает длину маршрута до него и возвращает её
      operationId: calculateRouteToLargest

      responses:
        '200':
          description: Длина маршрута
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteLength'

        '404':
          description: В коллекции отсутствуют города
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '502':
          description: Первый веб-сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /route/calculate/to-newest:
    get:
      tags:
        - Routes
      summary: Рассчитать длину маршрута до новейшего города
      description: |
        Получает из первого вебсервиса город созданный позже остальных,
        и рассчитывает длину маршрута от точки (0,0) до этого города.
      operationId: calculateRouteToNewest

      responses:
        '200':
          description: Длина маршрута
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteLength'

        '404':
          description: В коллекции отсутствуют города
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '502':
          description: Первый веб-сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:

  parameters:

    CityId:
      name: id
      in: path
      required: true
      description: Уникальный идентификатор города
      schema:
        type: integer
        format: int32
        minimum: 1

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum:
          - id
          - name
          - coordinates.x
          - coordinates.y
          - creationDate
          - area
          - population
          - metersAboveSeaLevel
          - climate
          - government
          - standardOfLiving
          - governor.age
        default: id

    OrderBy:
      name: OrderBy
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc

  schemas:

    City:
      type: object
      required:
        - id
        - name
        - coordinates
        - creationDate
        - area
        - population
        - climate
        - government
        - governor
      properties:

        id:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: |
            Уникальный идентификатор
        name:
          type: string
          minLength: 1
          description: Название города

        coordinates:
          $ref: '#/components/schemas/Coordinates'

        creationDate:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-12T15:30:45"
          description: |
            Дата и время создания города.
        area:
          type: integer
          format: int64
          minimum: 1
          description: Площадь города

        population:
          type: integer
          format: int64
          minimum: 1
          description: Население города

        metersAboveSeaLevel:
          type: number
          format: double
          nullable: true
          description: Высота над уровнем моря

        climate:
          $ref: '#/components/schemas/Climate'

        government:
          $ref: '#/components/schemas/Government'

        standardOfLiving:
          allOf:
            - $ref: '#/components/schemas/StandardOfLiving'
          nullable: true
          description: Уровень жизни

        governor:
          $ref: '#/components/schemas/Human'


    CityCreate:
      type: object
      required:
        - name
        - coordinates
        - area
        - population
        - climate
        - government
        - governor
      properties:

        name:
          type: string
          minLength: 1

        coordinates:
          $ref: '#/components/schemas/Coordinates'

        area:
          type: integer
          format: int64
          minimum: 1

        population:
          type: integer
          format: int64
          minimum: 1

        metersAboveSeaLevel:
          type: number
          format: double
          nullable: true

        climate:
          $ref: '#/components/schemas/Climate'

        government:
          $ref: '#/components/schemas/Government'

        standardOfLiving:
          allOf:
            - $ref: '#/components/schemas/StandardOfLiving'
          nullable: true

        governor:
          $ref: '#/components/schemas/Human'


    CityUpdate:
      type: object
      required:
        - name
        - coordinates
        - area
        - population
        - climate
        - government
        - governor
      properties:

        name:
          type: string
          minLength: 1

        coordinates:
          $ref: '#/components/schemas/Coordinates'

        area:
          type: integer
          format: int64
          minimum: 1

        population:
          type: integer
          format: int64
          minimum: 1

        metersAboveSeaLevel:
          type: number
          format: double
          nullable: true

        climate:
          $ref: '#/components/schemas/Climate'

        government:
          $ref: '#/components/schemas/Government'

        standardOfLiving:
          allOf:
            - $ref: '#/components/schemas/StandardOfLiving'
          nullable: true

        governor:
          $ref: '#/components/schemas/Human'


    Coordinates:
      type: object
      required:
        - y
      properties:
        x:
          type: integer
          format: int32
          nullable: false

        y:
          type: number
          format: double
          minimum: -594
          exclusiveMinimum: true
          nullable: false



    Human:
      type: object
      required:
        - age
      properties:
        age:
          type: integer
          format: int32
          minimum: 1

    Climate:
      type: string
      enum:
        - RAIN_FOREST
        - HUMIDSUBTROPICAL
        - HUMIDCONTINENTAL
        - SUBARCTIC
        - DESERT


    Government:
      type: string
      enum:
        - DICTATORSHIP
        - KLEPTOCRACY
        - KRITARCHY
        - REPUBLIC
        - TELLUROCRACY


    StandardOfLiving:
      type: string
      enum:
        - ULTRA_HIGH
        - HIGH
        - NIGHTMARE


    CityPage:
      type: object
      required:
        - content
        - page
        - pageSize
        - totalElements
        - totalPages
      properties:

        content:
          type: array
          items:
            $ref: '#/components/schemas/City'

        page:
          type: integer
          minimum: 1
          description: Номер текущей страницы

        pageSize:
          type: integer
          minimum: 1
          description: Размер страницы

        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Количество элементов

        totalPages:
          type: integer
          minimum: 0
          description: Количество страниц


    RouteLength:
      type: object
      required:
        - length
      properties:
        length:
          type: number
          format: double
          minimum: 0
          description: Длина маршрута


    Error:
      type: object
      required:
        - message
        - timestamp
      properties:

        code:
          type: integer

        message:
          type: string

        timestamp:
          type: string
          format: date-time
          example: "2026-09-12T15:30:45"

  responses:

    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Ошибка валидации параметров запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Объект с указанным id не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  
