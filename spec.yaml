openapi: 3.0.0
info:
  title: lab1
  description: lab1
  version: 1.0.0
paths:
  /cities:
    get:
      tags:
        - Cities
      summary: Получить список городов
      operationId: getCities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ArrayQuery'
        - $ref: '#/components/parameters/OrderedBy'
      responses:
        '200':
          description: Страница результатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityPage'


        '400':
          description: Неккоректный параметр фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный запрос"
                details:
                  - "Возраст должен быть положительным (governor.age)"
                timestamp: "2026-09-12T12:00:00+03:00"
    post:
      tags:
        - Cities
      summary: Добавить новый город
      operationId: createCity

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityRequest'
      responses:
        '201':
          description: Город успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '400':
          description: Неккоректный параметр объекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный запрос"
                details:
                  - "Возраст должен быть положительным (governor.age)"
                timestamp: "2026-09-12T12:00:00+03:00"

  /cities/{id}:
    get:
      tags:
        - Cities
      summary: Получить город по ID
      operationId: getCityById

      parameters:
        - $ref: '#/components/parameters/CityId'

      responses:
        '200':
          description: Город найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Cities
      summary: Обновить город
      operationId: updateCity

      parameters:
        - $ref: '#/components/parameters/CityId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityRequest'
      responses:
        '200':
          description: Город успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '400':
          description: Неккоректный параметр объекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Неккоректный параметр объекта"
                details:
                  - "Возраст должен быть положительным (governor.age)"
                timestamp: "2026-09-12T12:00:00+03:00"

        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Cities
      summary: Удалить город
      operationId: deleteCity

      parameters:
        - $ref: '#/components/parameters/CityId'

      responses:
        '204':
          description: Город удален или уже отсутствует
        '400':
          $ref: '#/components/responses/ValidationError'

        
  /cities/{parameter}/:
    get:
      tags:
        - Special operations
      summary: Получить объект с указанным параметром и фильтром
      description: |
        Возвращает любой город, параметр которого подходит под указаный фильтр
        Если городов подходящих несколько, то возвращается с минимальным идентификатором
      parameters:
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/CityStandardOfLiving'
        - $ref: '#/components/parameters/Type'


      responses:
        '200':
          description: Город с максимальным значением площади area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'

        '400':
          description: Неккоректный параметр фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный запрос"
                details:
                  - "Должен быть больше 0 (area)"
                timestamp: "2026-09-12T12:00:00+03:00"

components:

  parameters:

    CityId:
      name: id
      in: path
      required: true
      description: Уникальный идентификатор города
      schema:
        type: integer
        format: int32
        minimum: 1

    CityStandardOfLiving:
      name: standard-of-living
      in: path
      required: false
      description: Тип жизни в городе
      schema:
        type: string
        enum:
          - ULTRA_HIGH
          - HIGH
          - NIGHTMARE

    Name:
      name: name
      in: path
      required: false
      description: Название города
      schema:
        type: string
        minimum: 1

    Area:
      name: area
      in: path
      required: false
      description: Площадь города
      schema:
        type: integer
        format: int32
        minimum: 1

    Type:
      name: type
      in: query
      description: Применяемая операция
      required: true
      schema:
        type: string
        enum:
          - EQUALS
          - MIN
          - MAX

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OrderedBy:
      name: orderedBy
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          type: string
      examples:
        combined:
          summary: По населению по убыванию, затем по названию по возрастанию
          value:
            - population:desc
            - name:asc
        name:
          summary: По названию по возрастанию
          value:
            - name:asc
        creationDate:
          summary: Сначала недавно созданные города
          value:
            - creationDate:desc
    ArrayQuery:
      name: filters
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          type: string
      examples:
        combined:
          summary: Население больше 100000 и субарктический климат
          value:
            - population:moreThan:100000
            - climate:equals:SUBARCTIC
        range:
          summary: Диапазон площади
          value:
            - area:moreThan:100
            - area:lessThan:1000
        creationDate:
          summary: Города, созданные после указанной даты
          value:
            - creationDate:moreThan:2026-09-12T15:30:45
  schemas:
    City:
      description: Полный объект города, включая поля, генерируемые сервером.
      allOf:
        - $ref: '#/components/schemas/CityRequest'
        - type: object
          required:
            - id
            - creationDate
          properties:
            id:
              type: integer
              format: int32
              minimum: 1
              readOnly: true
              description: Уникальный идентификатор
            creationDate:
              type: string
              readOnly: true
              description: Дата и время создания города в формате LocalDateTime
              example: '2026-09-12T15:30:45'
    CityRequest:
      type: object
      required:
        - name
        - coordinates
        - area
        - population
        - climate
        - government
        - governor
      properties:

        name:
          type: string
          minLength: 1

        coordinates:
          $ref: '#/components/schemas/Coordinates'

        area:
          type: integer
          format: int64
          minimum: 1

        population:
          type: integer
          format: int64
          minimum: 1

        metersAboveSeaLevel:
          type: number
          format: double
          nullable: true

        climate:
          $ref: '#/components/schemas/Climate'

        government:
          $ref: '#/components/schemas/Government'

        standardOfLiving:
          allOf:
            - $ref: '#/components/schemas/StandardOfLiving'
          nullable: true

        governor:
          $ref: '#/components/schemas/Human'


    Coordinates:
      type: object
      required:
        - y
      properties:
        x:
          type: integer
          format: int32
          nullable: false

        y:
          type: number
          format: double
          minimum: -594
          exclusiveMinimum: true
          nullable: false



    Human:
      type: object
      required:
        - age
      properties:
        age:
          type: integer
          format: int32
          minimum: 1

    Climate:
      type: string
      enum:
        - RAIN_FOREST
        - HUMIDSUBTROPICAL
        - HUMIDCONTINENTAL
        - SUBARCTIC
        - DESERT


    Government:
      type: string
      enum:
        - DICTATORSHIP
        - KLEPTOCRACY
        - KRITARCHY
        - REPUBLIC
        - TELLUROCRACY


    StandardOfLiving:
      type: string
      enum:
        - ULTRA_HIGH
        - HIGH
        - NIGHTMARE
    CoordinatesFilter:
      type: object
      description: Фильтры по полям coordinates.
      properties:
        x:
          $ref: '#/components/schemas/IntFilter'
        y:
          $ref: '#/components/schemas/DoubleFilter'
    HumanFilter:
      type: object
      description: Фильтры по полям governor.
      properties:
        age:
          $ref: '#/components/schemas/IntFilter'
    FilterOperator:
      type: string
      enum:
        - moreThan
        - lessThan
        - equals
    SortOrder:
      type: string
      enum:
        - asc
        - desc
      description: Направление сортировки.
    IntFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: integer
          format: int32
    LongFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: integer
          format: int64
    DoubleFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: number
          format: double
    StringFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: string
    DateTimeFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          $ref: '#/components/schemas/FilterOperator'
        value:
          type: string
          description: Дата и время в формате LocalDateTime
          example: '2026-09-12T15:30:45'
    ClimateFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          type: string
          enum:
            - equals
        value:
          $ref: '#/components/schemas/Climate'
    GovernmentFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          type: string
          enum:
            - equals
        value:
          $ref: '#/components/schemas/Government'
    StandardOfLivingFilter:
      type: object
      required:
        - operator
        - value
      properties:
        operator:
          type: string
          enum:
            - equals
        value:
          $ref: '#/components/schemas/StandardOfLiving'
    CityPage:
      type: object
      required:
        - content
        - page
        - pageSize
        - totalElements
        - totalPages
      properties:

        content:
          type: array
          items:
            $ref: '#/components/schemas/City'

        page:
          type: integer
          minimum: 1
          description: Номер текущей страницы

        pageSize:
          type: integer
          minimum: 1
          description: Размер страницы
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Количество элементов
        totalPages:
          type: integer
          minimum: 0
          description: Количество страниц
    Error:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
  responses:
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Ошибка валидации параметров запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект с указанным id не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
