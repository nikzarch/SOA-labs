plugins {
    id 'java'
    id 'war'
}

group = 'ru.nikzarch'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    wildflyVersion = '41.0.1.Final'
    jakartaDataVersion = '1.0.2'
    postgresqlVersion = '42.7.13'
}

dependencies {
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:5.0.0'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation "jakarta.data:jakarta.data-api:${jakartaDataVersion}"
    implementation 'org.hibernate.orm:hibernate-core:7.1.36.Final'
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

war {
    archiveBaseName = 'firstService-api'
}